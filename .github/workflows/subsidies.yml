name: Subsidies bijwerken

on:
  schedule:
    - cron: "15 4 * * *"   # elke dag rond 06:15 Nederlandse tijd
  workflow_dispatch:        # handmatig starten via het tabblad Actions
    inputs:
      gemeenten:
        description: "Alleen deze gemeenten (komma's ertussen, bijv. Doesburg,Arnhem). Leeg = alle gemeenten, verder waar de vorige run stopte."
        required: false
        default: ""
      proef:
        description: "Proefrun: geen pull request, de uitkomst (Excel, regelingen.json, log) komt als download bij de run."
        type: boolean
        default: false
      aanbieder:
        description: "Taalmodel om mee te beginnen: standaard (Gemini, daarna reserves), of meteen een reserve: github, cerebras, mistral, groq, openrouter."
        required: false
        default: "standaard"
      zonder_ai:
        description: "Alleen zoeken (CVDR, gemeentesite, partners), niets naar het taalmodel. Om het zoeken te testen zonder tegoed."
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  models: read   # GitHub Models: gratis reserve-taalmodel, geen eigen sleutel nodig

# Nooit twee runs tegelijk: de tweede wacht tot de eerste klaar is.
concurrency:
  group: subsidies-bijwerken
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub staat max. 6 uur toe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # volledige geschiedenis, nodig om de openstaande update erbij te halen

      # Staat er nog een Subsidie-update open (niet gemerged)? Dan gaat deze run daar verder,
      # zodat het werk van de vorige run niet opnieuw gedaan wordt. De code komt altijd uit main;
      # alleen de gegevens (regelingen, wachtrij, status) komen uit de openstaande update.
      - name: Verder waar de vorige run bleef
        env:
          GH_TOKEN: ${{ github.token }}
        run: scraper/verder_op_open_update.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakketten installeren
        run: pip install requests google-genai anthropic openpyxl pypdf

      # Alleen bij een proef met aanbieder github: laat zien wat GitHub Models terugstuurt (zonder het token te tonen)
      - name: GitHub Models controleren
        if: github.event.inputs.aanbieder == 'github' && github.event.inputs.proef == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for url in https://models.github.ai/inference/chat/completions https://models.inference.ai.azure.com/chat/completions; do
            echo "== $url"
            curl -sS -i -X POST "$url" -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" \
              -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
              -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Zeg alleen: hallo"}],"max_tokens":5}' \
              | head -c 1500; echo
          done

      - name: Regelingen ophalen en voorwaarden uitlezen
        timeout-minutes: 320   # de run stopt zelf al na 300 min (config.json); dit is de noodrem
        run: |
          EXTRA=""
          if [ "$ZONDER_AI" = "true" ]; then EXTRA="--zonder-ai"; fi
          if [ -n "$AANBIEDER" ] && [ "$AANBIEDER" != "standaard" ]; then EXTRA="$EXTRA --aanbieder $AANBIEDER"; fi
          if [ -n "$ALLEEN" ]; then
            python -u scraper/run.py --alleen "$ALLEEN" $EXTRA
          else
            python -u scraper/run.py --vergelijk tests/baseline_pilot.json $EXTRA
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALLEEN: ${{ github.event.inputs.gemeenten }}
          ZONDER_AI: ${{ github.event.inputs.zonder_ai }}
          AANBIEDER: ${{ github.event.inputs.aanbieder }}
          # reserve-taalmodellen (zie reserve_aanbieders in scraper/config.json); ontbrekende worden overgeslagen
          GITHUB_TOKEN: ${{ github.token }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      # Is de run hard gestopt (noodrem, runner weg)? Dan staat er wel een tussentijdse stand,
      # maar zijn het overzicht en de TIOS-export misschien niet bijgewerkt. Dat gebeurt hier.
      - name: Afronden na een onderbreking
        if: failure()
        run: python -u scraper/run.py --alleen-overzicht

      # Wijzigingen komen als pull request binnen: jij controleert, daarna pas live.
      # Ook na een onderbreking, zodat het werk tot dan toe niet verloren gaat.
      # Proefrun: geen pull request, wel alles als download (tabblad Actions → de run → Artifacts)
      - name: Uitkomst van de proefrun bewaren
        if: always() && github.event.inputs.proef == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: proefrun
          path: |
            regelingen.json
            zoekstatus.json
            overzicht_voorwaarden.xlsx
            data/web_state.json
            data/gemeente_sites.json
            data/wijzigingen_laatste.md

      - name: Pull request maken bij wijzigingen
        if: always() && github.event.inputs.proef != 'true' && github.event.inputs.zonder_ai != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: subsidie-update
          title: "Subsidie-update"
          commit-message: "Subsidie-update"
          body-path: data/wijzigingen_laatste.md
          add-paths: |
            regelingen.json
            zoekstatus.json
            overzicht_voorwaarden.xlsx
            tios/**
            data/**
